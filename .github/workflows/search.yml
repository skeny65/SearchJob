name: Keny Job Hunter

on:
  schedule:
    - cron: "17 1 * * *" # 20:17 Lima (UTC-5), daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keny-job-hunter
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Search and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main
      - name: Persist minimal dedup state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          if [ -f reports/latest.json ]; then git add reports/latest.json; fi
          git diff --cached --quiet || (git commit -m "chore: persist job search state" && git push)
